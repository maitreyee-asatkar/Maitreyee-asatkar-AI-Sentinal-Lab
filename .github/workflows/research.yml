name: Interpretability Research

on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face model id
        required: true
        default: gpt2

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-model.txt
          pip install -r requirements-interpretability.txt
      - name: Run residual experiment
        run: python -m interpretability.run_research --model "${{ inputs.model }}" --output artifacts/residual_probe.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: residual-probe
          path: artifacts/residual_probe.json
