name: Interpretability Research

on:
  push:
    paths:
      - 'interpretability/**'
      - 'requirements-model.txt'
      - 'requirements-interpretability.txt'
      - '.github/workflows/research.yml'
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face model id
        required: true
        default: gpt2

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-model.txt
          pip install -r requirements-interpretability.txt
      - name: Run residual experiment
        env:
          MODEL_NAME: ${{ inputs.model || 'gpt2' }}
        run: python -m interpretability.run_research --model "$MODEL_NAME" --output artifacts/residual_probe.json
      - name: Run attention-head experiment
        env:
          MODEL_NAME: ${{ inputs.model || 'gpt2' }}
        run: python -m interpretability.attention_heads --model "$MODEL_NAME" --output artifacts/attention_heads.json --layers 8 9 10 11
      - name: Run NNsight activation experiment
        env:
          MODEL_NAME: ${{ inputs.model || 'gpt2' }}
        run: python -m interpretability.nnsight_activation --model "$MODEL_NAME" --layer 10 --output artifacts/nnsight_activation.json
      - name: Run causal head-ablation experiment
        env:
          MODEL_NAME: ${{ inputs.model || 'gpt2' }}
        run: python -m interpretability.head_ablation --model "$MODEL_NAME" --layer 10 --head 6 --output artifacts/head_ablation.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: interpretability-results
          path: |
            artifacts/residual_probe.json
            artifacts/attention_heads.json
            artifacts/nnsight_activation.json
            artifacts/head_ablation.json
